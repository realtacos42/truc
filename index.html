<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Le bouton</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="hud">
      <p class="score">PV : <span id="hp">100</span> / 100</p>
      <p class="hint" id="hint">Clique le bouton pour lui faire des dégâts</p>
    </div>
    <div class="arena">
      <div class="fighter">
        <div class="hp-bar" aria-hidden="true">
          <div class="hp-fill" id="hpFill"></div>
        </div>
        <button type="button" class="game-btn" id="gameBtn">100 PV</button>
        <p class="hit-label" id="hitLabel" aria-hidden="true"></p>
      </div>
    </div>
    <script src="game.js"></script>
  </body>
</html>
